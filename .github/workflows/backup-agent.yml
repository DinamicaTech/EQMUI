name: backup-agent

on:
  pull_request:
    paths: ['Tools/**', '.github/workflows/backup-agent.yml']
  push:
    branches: [main]
    paths: ['Tools/**', '.github/workflows/backup-agent.yml']
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Tools/global.json
      - name: Core tests
        run: dotnet test Tools/DinamicaBackup.Tests/DinamicaBackup.Tests.csproj -c Release
      - name: Agent tests
        run: dotnet test Tools/DinamicaBackupAgent.Tests/DinamicaBackupAgent.Tests.csproj -c Release
      - name: Publish the agent
        run: dotnet publish Tools/DinamicaBackupAgent/DinamicaBackupAgent.csproj -c Release -r win-x64 --self-contained false -o publish/DinamicaBackupAgent
      - uses: actions/upload-artifact@v4
        with:
          name: DinamicaBackupAgent
          path: publish/DinamicaBackupAgent
          retention-days: 30
